<?xml version="1.0"?>
<fontconfig>
  <!-- KiCad (pcbnew / kicad-cli) ships its own fontconfig but no default
       config, so system fonts are unresolvable and text falls back to the
       built-in stroke font. This config makes fontconfig scan the standard
       macOS font directories (system + user), including the split
       Baskerville-SemiBold.ttf installed to ~/Library/Fonts. -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="~">Library/Fonts</dir>
</fontconfig>
